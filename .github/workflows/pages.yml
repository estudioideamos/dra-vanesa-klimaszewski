name: Validate and publish static website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          node --check script.js
          node --check assets/icons.js
          php -l nuthost-formulario/contacto.php
          node --test qa/security.test.cjs
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html mednix.css script.js CNAME robots.txt sitemap.xml llms.txt humans.txt .nojekyll _site/
          cp -R articulos _site/articulos
          mkdir _site/assets
          git ls-files -z assets | xargs -0 -I{} cp {} _site/assets/
          rm -f _site/assets/lucide.min.js
          test ! -e _site/nuthost-formulario
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e